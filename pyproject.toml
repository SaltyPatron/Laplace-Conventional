[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laplace-conventional"
version = "0.3.0"
description = "Standalone, corpus-first conventional model training over the Laplace corpus estate"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "sentencepiece>=0.2.0,<0.3",
  "psutil>=6,<8",
  "tomli>=2.2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
train = [
  "transformers>=5.17,<6",
  "accelerate>=1.15,<2",
  "safetensors>=0.5,<1",
]
rl = [
  "datasets>=5.0,<6",
  "trl>=1.13,<2",
]
offload = [
  "deepspeed==0.19.6",
  "ninja>=1.11,<2",
]
test = ["pytest>=8,<9"]

[project.scripts]
laplace-conventional = "laplace_conventional.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
