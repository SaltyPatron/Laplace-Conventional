name: verify
# Every job runs on this repository's own runner (hart-server). A job owns a
# virtual environment under the runner's temp directory, which the runner empties
# between jobs, so nothing is installed into the host or the tool cache's Python.
# Pull requests from forks never run on it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, laplace-conventional]
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Create this job's own environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "PIP_CACHE_DIR=$RUNNER_TOOL_CACHE/pip" >> "$GITHUB_ENV"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q src tests
      - run: pytest -q tests/test_corpus.py tests/test_selection.py tests/test_modality_providers.py tests/test_configure.py tests/test_execution.py tests/test_host_policy.py tests/test_script_paths.py

  training-stack:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, laplace-conventional]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Create this job's own environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "PIP_CACHE_DIR=$RUNNER_TOOL_CACHE/pip" >> "$GITHUB_ENV"
      - run: python -m pip install --upgrade pip
      - name: Install current CPU training stack
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,rl,test]'
      - run: python -m compileall -q src tests
      - run: pytest -q tests/test_training_stack.py
      - name: Import post-training providers
        run: python -c 'import accelerate, datasets, transformers, trl; print(accelerate.__version__, datasets.__version__, transformers.__version__, trl.__version__)'

  media-stack:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, laplace-conventional]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create this job's own environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "PIP_CACHE_DIR=$RUNNER_TOOL_CACHE/pip" >> "$GITHUB_ENV"
      - run: python -m pip install --upgrade pip
      - name: Install CPU media training stack
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,media,test]'
      - run: python -m compileall -q src tests
      - name: Execute self-supervised gradient and decoder paths
        run: pytest -q tests/test_media_stack.py
