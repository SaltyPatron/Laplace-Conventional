[corpus]
validation_per_10k = 100
require_full_coverage = true

[selection]
# Physical inventory and training admission are distinct. Every exclusion must
# be an explicit ordered rule with a reason; the default is to select everything.
default_selected = true
rules = []

[records]
max_chars = 64000

[tokenizer]
vocab_candidates = [8192, 16384, 32768, 65536]

[derivation]
tokens_per_parameter = 20.0
context_quantile = "p95"

[training]
global_tokens_per_step = 131072
learning_rate = 0.0003
weight_decay = 0.1
warmup_ratio = 0.01
min_lr_ratio = 0.1
gradient_clip = 1.0
epochs = 1.0
checkpoint_fraction = 0.01
minimum_checkpoint_tokens = 10000000

# Named, conventional self-supervised modality baselines. These dimensions are
# explicit experiment policy, not hidden guesses and not hardware-dependent.
[modalities.image]
enabled = true
provider = "image-vit-mae"
image_size = 224
patch_size = 16
hidden_size = 768
num_hidden_layers = 12
num_attention_heads = 12
intermediate_size = 3072
decoder_hidden_size = 512
decoder_num_hidden_layers = 8
decoder_num_attention_heads = 16
decoder_intermediate_size = 2048
mask_ratio = 0.75
norm_pix_loss = true
learning_rate = 0.00015
weight_decay = 0.05
epochs = 1.0

[modalities.audio]
enabled = true
provider = "audio-wav2vec2"
sample_rate = 16000
chunk_seconds = 10.0
hidden_size = 768
num_hidden_layers = 12
num_attention_heads = 12
intermediate_size = 3072
hidden_dropout = 0.0
attention_dropout = 0.0
feat_proj_dropout = 0.0
mask_time_prob = 0.065
mask_time_length = 10
num_negatives = 100
codevector_dim = 256
proj_codevector_dim = 256
num_codevector_groups = 2
num_codevectors_per_group = 320
learning_rate = 0.0005
weight_decay = 0.01
epochs = 1.0

[modalities.video]
enabled = true
provider = "video-videomae"
image_size = 224
patch_size = 16
num_frames = 16
tubelet_size = 2
hidden_size = 768
num_hidden_layers = 12
num_attention_heads = 12
intermediate_size = 3072
decoder_hidden_size = 384
decoder_num_hidden_layers = 4
decoder_num_attention_heads = 6
decoder_intermediate_size = 1536
mask_ratio = 0.90
norm_pix_loss = true
learning_rate = 0.00015
weight_decay = 0.05
epochs = 1.0
include_audio_track = true

[execution]
# Model dimensions are never changed by this section. This section only chooses
# how the exact generated model is physically executed on the measured host.
backend = "auto" # auto | native | deepspeed_zero3_cpu_offload
precision = "fp32"
micro_batch_size = 1
shard_bytes = 536870912
gpu_memory_fraction = 0.88
ram_memory_fraction = 0.75
activation_reserve_fraction = 0.20
native_state_bytes_per_parameter = 16
zero3_layer_working_set_multiplier = 3.0
zero3_cpu_state_overhead = 1.20
