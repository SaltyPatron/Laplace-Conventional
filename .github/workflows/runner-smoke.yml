name: runner-smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: [self-hosted, Linux, X64, laplace-conventional]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify configured runner storage and declared GPU eligibility
        shell: bash
        run: |
          set -euo pipefail
          scratch="${TMPDIR:-$RUNNER_TEMP}"
          test -d "$scratch" && test -w "$scratch"
          probe=$(mktemp -d "$scratch/runner-proof.XXXXXXXX")
          trap 'rm -rf -- "$probe"' EXIT
          printf 'runner storage proof\n' > "$probe/output"
          test "$(cat "$probe/output")" = 'runner storage proof'
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m laplace_conventional.host_policy
          echo 'PASS: configured scratch write/read and host policy; no GPU hardware accessed'
