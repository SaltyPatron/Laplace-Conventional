name: verify
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q src tests
      - run: pytest -q tests/test_corpus.py tests/test_selection.py tests/test_modality_providers.py tests/test_configure.py tests/test_execution.py

  training-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - name: Install current CPU training stack
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,rl,test]'
      - run: python -m compileall -q src tests
      - run: pytest -q tests/test_training_stack.py
      - name: Import post-training providers
        run: python -c 'import accelerate, datasets, transformers, trl; print(accelerate.__version__, datasets.__version__, transformers.__version__, trl.__version__)'

  media-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - name: Install CPU media training stack
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,media,test]'
      - run: python -m compileall -q src tests
      - name: Execute self-supervised gradient and decoder paths
        run: pytest -q tests/test_media_stack.py
