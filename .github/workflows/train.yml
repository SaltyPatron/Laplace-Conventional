name: train
on:
  workflow_dispatch:
    inputs:
      data_root:
        description: Corpus root on the self-hosted runner
        required: true
        default: /vault/Data
      state_dir:
        description: Generated state directory
        required: true
        default: /opt/laplace/conventional/state
      output_dir:
        description: Checkpoint directory
        required: true
        default: /opt/laplace/conventional/checkpoints

jobs:
  train:
    runs-on: [self-hosted, Linux, X64, laplace-conventional, gpu, pascal, 1080ti]
    timeout-minutes: 10080
    steps:
      - uses: actions/checkout@v4
      - name: Verify GPU and corpus mount
        run: |
          nvidia-smi
          test -d '${{ inputs.data_root }}'
      - name: Install/update environment
        run: ./scripts/setup.sh
      - name: Inventory, select, prepare and plan every admitted lane
        run: ./scripts/configure.sh '${{ inputs.data_root }}' '${{ inputs.state_dir }}'
      - name: Train every admitted lane
        run: ./scripts/train-all.sh '${{ inputs.data_root }}' '${{ inputs.state_dir }}' '${{ inputs.output_dir }}'
