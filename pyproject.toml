[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laplace-conventional"
version = "0.4.0"
description = "Standalone, corpus-first conventional model training over the Laplace corpus estate"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "sentencepiece>=0.2.0,<0.3",
  "psutil>=6,<8",
  "tomli>=2.2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
train = [
  "transformers==5.17.0",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
]
media = [
  "pillow==12.3.0",
  "imageio-ffmpeg==0.6.0",
]
rl = [
  "datasets==5.0.1",
  "trl==1.13.0",
]
offload = [
  "deepspeed==0.19.6",
  "ninja>=1.11,<2",
]
test = ["pytest>=8,<9"]

[project.scripts]
laplace-conventional = "laplace_conventional.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
