[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laplace-conventional"
version = "0.2.0"
description = "Standalone, corpus-first conventional model training over the Laplace corpus estate"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "sentencepiece>=0.2.0,<0.3",
  "psutil>=6,<8",
]

[project.optional-dependencies]
train = [
  "transformers>=4.56,<5",
  "accelerate>=1.10,<2",
  "safetensors>=0.5,<1",
]
rl = [
  "datasets>=4,<5",
  "trl>=1.8,<2",
]
test = ["pytest>=8,<9"]

[project.scripts]
laplace-conventional = "laplace_conventional.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
